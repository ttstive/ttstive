<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Estevão Lins Maia — Data Engineer — Press Start">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.7" stop-color="#261447"/>
      <stop offset="1" stop-color="#2e1255"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe600"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <clipPath id="floor"><rect x="0" y="195" width="800" height="65"/></clipPath>
    <clipPath id="sunclip"><rect x="0" y="0" width="800" height="195"/></clipPath>
  </defs>

  <style>
    .star{fill:#fff;animation:tw 2.4s infinite}
    .s2{animation-delay:.8s}.s3{animation-delay:1.6s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .hud{font:bold 13px 'Courier New',monospace;fill:#05d9e8;letter-spacing:2px}
    .hud b{fill:#fff}
    .title{font:bold 42px 'Courier New',monospace;letter-spacing:4px;text-anchor:middle}
    .front{fill:#ffe600}
    .back{fill:#ff2a6d}
    .sub{font:bold 16px 'Courier New',monospace;fill:#05d9e8;letter-spacing:3px;text-anchor:middle}
    .press{font:bold 20px 'Courier New',monospace;fill:#fff;letter-spacing:4px;text-anchor:middle;animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .vline{stroke:#ff2a6d;stroke-width:1.2;opacity:.7}
    .hline{stroke:#ff2a6d;stroke-width:1.2;opacity:.7}
    .move{animation:run 1.2s linear infinite}
    @keyframes run{from{transform:translateY(0)}to{transform:translateY(13px)}}
    .packet{animation:fly 6s linear infinite}
    @keyframes fly{from{transform:translateX(-60px)}to{transform:translateX(860px)}}
    .bob{animation:bob .4s steps(2) infinite}
    @keyframes bob{50%{transform:translateY(-3px)}}
  </style>

  <!-- sky -->
  <rect width="800" height="260" fill="url(#sky)"/>

  <!-- stars -->
  <rect class="star" x="60" y="40" width="3" height="3"/>
  <rect class="star s2" x="140" y="120" width="2" height="2"/>
  <rect class="star s3" x="230" y="55" width="3" height="3"/>
  <rect class="star s2" x="330" y="140" width="2" height="2"/>
  <rect class="star" x="480" y="130" width="2" height="2"/>
  <rect class="star s3" x="560" y="45" width="3" height="3"/>
  <rect class="star s2" x="650" y="120" width="2" height="2"/>
  <rect class="star" x="740" y="60" width="3" height="3"/>
  <rect class="star s3" x="30" y="150" width="2" height="2"/>
  <rect class="star" x="770" y="160" width="2" height="2"/>

  <!-- striped synthwave sun -->
  <g clip-path="url(#sunclip)">
    <circle cx="400" cy="195" r="62" fill="url(#sun)"/>
    <rect x="330" y="160" width="140" height="3" fill="#261447"/>
    <rect x="330" y="170" width="140" height="4" fill="#261447"/>
    <rect x="330" y="180" width="140" height="5" fill="#2e1255"/>
    <rect x="330" y="189" width="140" height="6" fill="#2e1255"/>
  </g>

  <!-- grid floor -->
  <rect x="0" y="195" width="800" height="65" fill="#120428"/>
  <g clip-path="url(#floor)">
    <line class="vline" x1="400" y1="195" x2="400" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="320" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="480" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="230" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="570" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="120" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="680" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="-20" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="820" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="-200" y2="260"/>
    <line class="vline" x1="400" y1="195" x2="1000" y2="260"/>
    <g class="move">
      <line class="hline" x1="0" y1="186" x2="800" y2="186"/>
      <line class="hline" x1="0" y1="199" x2="800" y2="199"/>
      <line class="hline" x1="0" y1="212" x2="800" y2="212"/>
      <line class="hline" x1="0" y1="225" x2="800" y2="225"/>
      <line class="hline" x1="0" y1="238" x2="800" y2="238"/>
      <line class="hline" x1="0" y1="251" x2="800" y2="251"/>
    </g>
  </g>
  <line x1="0" y1="195" x2="800" y2="195" stroke="#05d9e8" stroke-width="2"/>

  <!-- HUD -->
  <text class="hud" x="20" y="24">1UP <tspan fill="#fff">ETL</tspan></text>
  <text class="hud" x="400" y="24" text-anchor="middle">HI-SCORE <tspan fill="#fff">0xDATA</tspan></text>
  <text class="hud" x="780" y="24" text-anchor="end">CREDIT <tspan fill="#fff">∞</tspan></text>

  <!-- title with offset shadow -->
  <text class="title back" x="403" y="78">ESTEVÃO LINS MAIA</text>
  <text class="title front" x="400" y="75">ESTEVÃO LINS MAIA</text>
  <text class="sub" x="400" y="108">CLASS: DATA ENGINEER · GUILD: SICOOB · REGION: BR</text>

  <!-- pixel data packet running across the floor -->
  <g class="packet">
    <g class="bob">
      <rect x="0" y="206" width="24" height="18" fill="#05d9e8"/>
      <rect x="4" y="210" width="4" height="4" fill="#0d0221"/>
      <rect x="16" y="210" width="4" height="4" fill="#0d0221"/>
      <rect x="6" y="217" width="12" height="3" fill="#0d0221"/>
      <rect x="2" y="224" width="6" height="4" fill="#05d9e8"/>
      <rect x="16" y="224" width="6" height="4" fill="#05d9e8"/>
      <rect x="-14" y="213" width="10" height="3" fill="#ffe600" opacity=".7"/>
      <rect x="-26" y="218" width="8" height="3" fill="#ffe600" opacity=".4"/>
    </g>
  </g>

  <text class="press" x="400" y="252">▶ PRESS START ◀</text>
</svg>
